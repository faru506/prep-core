name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  backend:
    name: Rails Backend CI
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.1
          bundler-cache: true

      - name: Install dependencies
        working-directory: backend
        run: bundle install

       - name: Run tests
         working-directory: backend
         run: bundle exec rails test

  frontend:
    name: React Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: frontend
        run: npm install

       - name: Build frontend
         working-directory: frontend
         run: npm run build