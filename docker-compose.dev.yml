services:

  backend:
    build: ./backend
    container_name: rails_backend

    ports:
      - "3000:3000"

    volumes:
      - ./backend:/app

    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: react_frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

  mongodb:
    image: mongo:7

    container_name: mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: